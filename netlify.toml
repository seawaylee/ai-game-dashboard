[build]
  # Build command for all sub-projects
  command = "npm run install:all && npm run build"
  
  # Publish directory (root dist)
  publish = "dist"
  
  # Functions directory
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# API redirects (must come BEFORE catch-all)
[[redirects]]
  from = "/api/gemini/*"
  to = "/.netlify/functions/gemini-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/api/openai/speech"
  to = "/.netlify/functions/tts-proxy"
  status = 200
  force = true

# Sub-app SPA fallbacks (specific routes first)
[[redirects]]
  from = "/lingocard-genai/*"
  to = "/lingocard-genai/index.html"
  status = 200

[[redirects]]
  from = "/aistudio-wuziqi/*"
  to = "/aistudio-wuziqi/index.html"
  status = 200

[[redirects]]
  from = "/minecraft-mario/*"
  to = "/minecraft-mario/index.html"
  status = 200

[[redirects]]
  from = "/aistudio-calc/*"
  to = "/aistudio-calc/index.html"
  status = 200

[[redirects]]
  from = "/ultramath/*"
  to = "/ultramath/index.html"
  status = 200

# Main dashboard fallback (last resort)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
